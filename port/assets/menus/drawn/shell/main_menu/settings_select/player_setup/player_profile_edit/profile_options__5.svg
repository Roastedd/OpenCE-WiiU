<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256">
  <title>Video Setup: a TV showing a picture, and a tablet controller showing it too</title>
  <!-- The profile settings' picture of Video Setup (profile_options frame 5), drawn for this port
       in place of the PC version's: its widget shows the top left 279x202 of the frame, beside the
       list. tools/render_menu_art.py draws it at twice this size. -->
  <defs>
    <!-- the glow: the drawing's silhouette blurred in the menus' blue, and
         its lines' own bloom, under it -->
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="wide"/>
      <feFlood flood-color="#2895FF" flood-opacity="0.7"/>
      <feComposite in2="wide" operator="in" result="halo"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="bloom"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="bloom"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- a softer glow for the lines alone -->
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="bloom"/>
      <feMerge>
        <feMergeNode in="bloom"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- the projection's light, and its grid, fading out from the middle -->
    <radialGradient id="pool" gradientUnits="userSpaceOnUse" cx="143" cy="100" r="132" gradientTransform="translate(143 100) scale(1 0.73) translate(-143 -100)">
      <stop offset="0" stop-color="#1667C8" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#0E4FA6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0A3C86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" gradientUnits="userSpaceOnUse" cx="143" cy="100" r="132" gradientTransform="translate(143 100) scale(1 0.73) translate(-143 -100)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="fading" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="256">
      <rect width="512" height="256" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" patternUnits="userSpaceOnUse" x="3" y="2" width="14" height="14">
      <path d="M14 0H0V14" fill="none" stroke="#2F8EF0" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D3B78"/>
      <stop offset="1" stop-color="#04173A"/>
    </linearGradient>
    <clipPath id="tvscreen">
    <rect x="24" y="22" width="194" height="106"/>
    </clipPath>
    <clipPath id="padscreen">
    <rect x="170" y="136" width="60" height="40"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020D24"/>
      <stop offset="0.65" stop-color="#0E4C9A"/>
      <stop offset="1" stop-color="#2D8FE8"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#BDEBFF"/>
      <stop offset="0.5" stop-color="#3C9BEA"/>
      <stop offset="1" stop-color="#0B3C7E"/>
    </radialGradient>
  </defs>
  <!-- the projection: a pool of light and a faint grid -->
  <ellipse cx="143" cy="100" rx="132" ry="96" fill="url(#pool)"/>
  <rect x="11" y="4" width="264" height="192" fill="url(#grid)" opacity="0.22" mask="url(#fading)"/>
  <!-- the TV -->
  <g filter="url(#glow)">
    <rect x="115" y="134" width="12" height="12" fill="#06204A" stroke="#55BEFF" stroke-width="1.6"/>
    <path d="M87,151 q2,-6 10,-6 h48 q8,0 10,6 z" fill="#06204A" stroke="#55BEFF" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="18" y="16" width="206" height="118" rx="5" fill="#041634" stroke="#55BEFF" stroke-width="2.4"/>
    <g clip-path="url(#tvscreen)">
      <rect x="24" y="22" width="194" height="106" fill="url(#sky)"/>
      <circle cx="39.52" cy="37.9" r="1.02" fill="#E6F9FF"/>
      <circle cx="62.8" cy="55.92" r="1.02" fill="#E6F9FF"/>
      <circle cx="88.02" cy="34.72" r="1.02" fill="#E6F9FF"/>
      <circle cx="115.18" cy="50.62" r="1.02" fill="#E6F9FF"/>
      <circle cx="136.52" cy="32.6" r="1.02" fill="#E6F9FF"/>
      <circle cx="47.28" cy="69.7" r="1.02" fill="#E6F9FF"/>
      <circle cx="198.6" cy="34.72" r="1.02" fill="#E6F9FF"/>
      <circle cx="101.6" cy="64.4" r="1.02" fill="#E6F9FF"/>
      <circle cx="78.32" cy="45.32" r="1.02" fill="#E6F9FF"/>
      <circle cx="171.44" cy="75" r="38.8" fill="url(#planet)"/>
      <ellipse cx="171.44" cy="75" rx="58.2" ry="8.73" transform="rotate(-14 171.44 75)" fill="none" stroke="#A8E6FF" stroke-width="1.21" opacity="0.85"/>
      <polygon points="24,94.08 47.28,85.6 72.5,89.84 101.6,75 124.88,83.48 152.04,77.12 179.2,85.6 202.48,80.3 218,85.6 218,128 24,128" fill="#0B3A78" stroke="#55BEFF" stroke-width="0.97"/>
      <polygon points="24,108.92 53.1,100.44 82.2,106.8 113.24,96.2 144.28,105.74 175.32,98.32 218,106.8 218,128 24,128" fill="#062452" stroke="#55BEFF" stroke-width="0.97"/>
    </g>
    <rect x="24" y="22" width="194" height="106" fill="none" stroke="#2A7FD4" stroke-width="1"/>
    <path d="M28,35 v-9 h9 M205,26 h9 v9 M214,115 v9 h-9 M37,124 h-9 v-9" fill="none" stroke="#E6F9FF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- the tablet controller, in front of it -->
  <g filter="url(#glow)">
    <rect x="134" y="126" width="132" height="62" rx="16" fill="url(#body)" stroke="#55BEFF" stroke-width="2.4"/>
    <rect x="167" y="133" width="66" height="46" rx="2" fill="#020C20" stroke="#2A7FD4" stroke-width="1"/>
    <g clip-path="url(#padscreen)">
      <rect x="170" y="136" width="60" height="40" fill="url(#sky)"/>
      <circle cx="174.8" cy="142" r="0.6" fill="#E6F9FF"/>
      <circle cx="182" cy="148.8" r="0.6" fill="#E6F9FF"/>
      <circle cx="189.8" cy="140.8" r="0.6" fill="#E6F9FF"/>
      <circle cx="198.2" cy="146.8" r="0.6" fill="#E6F9FF"/>
      <circle cx="204.8" cy="140" r="0.6" fill="#E6F9FF"/>
      <circle cx="177.2" cy="154" r="0.6" fill="#E6F9FF"/>
      <circle cx="224" cy="140.8" r="0.6" fill="#E6F9FF"/>
      <circle cx="194" cy="152" r="0.6" fill="#E6F9FF"/>
      <circle cx="186.8" cy="144.8" r="0.6" fill="#E6F9FF"/>
      <circle cx="215.6" cy="156" r="12" fill="url(#planet)"/>
      <ellipse cx="215.6" cy="156" rx="18" ry="2.7" transform="rotate(-14 215.6 156)" fill="none" stroke="#A8E6FF" stroke-width="0.7" opacity="0.85"/>
      <polygon points="170,163.2 177.2,160 185,161.6 194,156 201.2,159.2 209.6,156.8 218,160 225.2,158 230,160 230,176 170,176" fill="#0B3A78" stroke="#55BEFF" stroke-width="0.6"/>
      <polygon points="170,168.8 179,165.6 188,168 197.6,164 207.2,167.6 216.8,164.8 230,168 230,176 170,176" fill="#062452" stroke="#55BEFF" stroke-width="0.6"/>
    </g>
    <circle cx="151" cy="143" r="8" fill="#062452" stroke="#A8E6FF" stroke-width="1.6"/>
    <circle cx="151" cy="143" r="3.4" fill="#55BEFF"/>
    <circle cx="249" cy="143" r="8" fill="#062452" stroke="#A8E6FF" stroke-width="1.6"/>
    <circle cx="249" cy="143" r="3.4" fill="#55BEFF"/>
    <path d="M144,167 h14 M151,160 v14" stroke="#A8E6FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="249" cy="161" r="2.6" fill="#A8E6FF"/>
    <circle cx="255" cy="167" r="2.6" fill="#A8E6FF"/>
    <circle cx="249" cy="173" r="2.6" fill="#A8E6FF"/>
    <circle cx="243" cy="167" r="2.6" fill="#A8E6FF"/>
  </g>
</svg>
