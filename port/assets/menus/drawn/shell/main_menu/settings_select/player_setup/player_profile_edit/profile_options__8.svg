<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256">
  <title>About: a ring world in space, a planet and its sun beyond it</title>
  <!-- The profile settings' picture of About (profile_options frame 8), drawn for this port in
       place of the PC version's: its widget shows the top left 279x202 of the frame, beside the
       list. tools/render_menu_art.py draws it at twice this size. -->
  <defs>
    <!-- the glow: the drawing's silhouette blurred in the menus' blue, and
         its lines' own bloom, under it -->
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="wide"/>
      <feFlood flood-color="#2895FF" flood-opacity="0.7"/>
      <feComposite in2="wide" operator="in" result="halo"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="bloom"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="bloom"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- a softer glow for the lines alone -->
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="bloom"/>
      <feMerge>
        <feMergeNode in="bloom"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- the projection's light, and its grid, fading out from the middle -->
    <radialGradient id="pool" gradientUnits="userSpaceOnUse" cx="143" cy="100" r="132" gradientTransform="translate(143 100) scale(1 0.73) translate(-143 -100)">
      <stop offset="0" stop-color="#1667C8" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#0E4FA6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0A3C86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" gradientUnits="userSpaceOnUse" cx="143" cy="100" r="132" gradientTransform="translate(143 100) scale(1 0.73) translate(-143 -100)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="fading" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="256">
      <rect width="512" height="256" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" patternUnits="userSpaceOnUse" x="3" y="2" width="14" height="14">
      <path d="M14 0H0V14" fill="none" stroke="#2F8EF0" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D3B78"/>
      <stop offset="1" stop-color="#04173A"/>
    </linearGradient>
    <clipPath id="planetclip">
    <circle cx="214" cy="66" r="42"/>
    </clipPath>
    <radialGradient id="planet" cx="0.3" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#5FB6F5"/>
      <stop offset="0.45" stop-color="#1A5FB0"/>
      <stop offset="1" stop-color="#05193C"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#A8E6FF"/>
      <stop offset="1" stop-color="#2895FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inner" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="252" y2="0">
      <stop offset="0" stop-color="#5BBEFF"/>
      <stop offset="0.55" stop-color="#2A86DF"/>
      <stop offset="1" stop-color="#0F4E9E"/>
    </linearGradient>
    <linearGradient id="land" gradientUnits="userSpaceOnUse" x1="24" y1="0" x2="252" y2="0">
      <stop offset="0" stop-color="#D2F3FF"/>
      <stop offset="1" stop-color="#6CC4FF"/>
    </linearGradient>
    <linearGradient id="outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B3772"/>
      <stop offset="1" stop-color="#041634"/>
    </linearGradient>
  </defs>
  <!-- the projection: a pool of light and a faint grid -->
  <ellipse cx="143" cy="100" rx="132" ry="96" fill="url(#pool)"/>
  <rect x="11" y="4" width="264" height="192" fill="url(#grid)" opacity="0.22" mask="url(#fading)"/>
  <!-- the stars, and the sun -->
  <g filter="url(#soft)">
    <circle cx="28" cy="26" r="1.4" fill="#E6F9FF" opacity="0.95"/>
    <circle cx="64" cy="66" r="0.9" fill="#E6F9FF" opacity="0.6"/>
    <circle cx="96" cy="30" r="0.9" fill="#E6F9FF" opacity="0.6"/>
    <circle cx="124" cy="14" r="1.4" fill="#E6F9FF" opacity="0.95"/>
    <circle cx="232" cy="168" r="0.9" fill="#E6F9FF" opacity="0.6"/>
    <circle cx="262" cy="128" r="0.9" fill="#E6F9FF" opacity="0.6"/>
    <circle cx="20" cy="150" r="1.4" fill="#E6F9FF" opacity="0.95"/>
    <circle cx="176" cy="30" r="0.9" fill="#E6F9FF" opacity="0.6"/>
    <circle cx="70" cy="176" r="0.9" fill="#E6F9FF" opacity="0.6"/>
    <circle cx="200" cy="186" r="1.4" fill="#E6F9FF" opacity="0.95"/>
    <circle cx="252" cy="24" r="0.9" fill="#E6F9FF" opacity="0.6"/>
    <circle cx="36" cy="104" r="0.9" fill="#E6F9FF" opacity="0.6"/>
    <circle cx="48" cy="40" r="10" fill="url(#sun)"/>
    <path d="M26,40 H70 M48,24 V56" stroke="#E6F9FF" stroke-width="1" opacity="0.8"/>
  </g>
  <!-- the planet beyond the ring -->
  <g filter="url(#glow)">
    <circle cx="214" cy="66" r="42" fill="url(#planet)"/>
    <path d="M168,54 q46,-12 92,2 M170,72 q46,-10 92,4 M176,90 q40,-6 80,4" fill="none" stroke="#55BEFF" stroke-width="1" opacity="0.5" clip-path="url(#planetclip)"/>
    <circle cx="214" cy="66" r="42" fill="none" stroke="#55BEFF" stroke-width="1.8"/>
  </g>
